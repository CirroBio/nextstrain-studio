name: container

# Builds the pipelines' image (pipelines/container/Dockerfile) and pushes it to GHCR, tagged with
# the nextstrain/base build it extends. Cirro pulls it anonymously, so the package must be public.
on:
  push:
    branches: [main]
    paths: [pipelines/container/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag from the base image
        id: tag
        run: echo "tag=$(sed -n 's/^FROM nextstrain\/base:\(.*\)$/\1/p' pipelines/container/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: pipelines/container
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cirrobio/nextstrain-studio-base:${{ steps.tag.outputs.tag }}
